apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crm-postgres
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.database.storage }} }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crm-postgres
  namespace: {{ .Values.namespace }}
spec:
  serviceName: crm-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: crm-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: crm-postgres }
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: crm-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: crm-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: crm-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts: [{ name: dados, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "crm"] }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
      volumes: [{ name: dados, persistentVolumeClaim: { claimName: crm-postgres } }]
---
apiVersion: v1
kind: Service
metadata:
  name: crm-postgres
  namespace: {{ .Values.namespace }}
spec:
  selector: { app.kubernetes.io/name: crm-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]

