apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  namespace: {{ .Values.namespace }}
  labels: {{- include "crm.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  CRM_API_URL: http://crm-backend:8080
  GENERIC_TIMEZONE: America/Sao_Paulo
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  CRM_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  N8N_ENCRYPTION_KEY: {{ .Values.secrets.n8nEncryptionKey | quote }}

