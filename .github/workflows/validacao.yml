name: Validação contínua

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Java
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn --batch-mode verify

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  containers-e-helm:
    name: Containers e Helm
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infrastructure/helm/crm
      - run: helm template crm infrastructure/helm/crm > /tmp/crm-manifestos.yaml
      - run: docker build -t crm-backend:${{ github.sha }} backend
      - run: docker build -t crm-frontend:${{ github.sha }} frontend
      - run: docker build -t crm-agentes:${{ github.sha }} services/ai-agents

